[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "generic-dubbing-pipeline"
version = "0.1.0"
description = "Config-driven VN/in-engine and embedded-FMV dubbing pipeline"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dubbing-pipeline = "dubbing_pipeline.cli:main"

[project.optional-dependencies]
audio = ["numpy>=1.24", "soundfile>=0.12", "librosa>=0.10"]
qa = ["faster-whisper>=1.0", "pyloudnorm>=0.1"]
omnivoice = ["torch", "torchaudio"]
cri = ["wannacri"]
all = ["numpy>=1.24", "soundfile>=0.12", "librosa>=0.10", "faster-whisper>=1.0", "pyloudnorm>=0.1", "torch", "torchaudio", "whisperx>=3.3", "speechbrain>=1.0"]
attestation = ["cryptography>=42"]
alignment = ["whisperx>=3.3", "speechbrain>=1.0"]
dev = ["pytest>=8", "coverage>=7", "jsonschema>=4.20"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dubbing_pipeline*", "adapters*"]

[tool.pytest.ini_options]
testpaths = ["tests", "ported"]
markers = ["historical: optional tests requiring an external OmniVoice/P3R asset checkout"]
