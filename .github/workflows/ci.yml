name: generic-dubbing-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dubbing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade "pip==25.0.1"
          python -m pip install --constraint constraints-ci.txt -e ".[audio,dev]"
      - name: Verify dependency graph
        run: python -m pip check
      - name: Full pytest discovery
        run: python -m pytest -q
      - name: Release gates
        run: python scripts/release_check.py --skip-pytest --out artifacts/release_check_ci.json
      - name: Capture resolved environment
        if: always()
        run: |
          python --version > artifacts/runtime.txt
          python -m pip freeze --all > artifacts/pip-freeze.txt
      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-check-${{ github.run_id }}
          path: |
            src/artifacts/release_check_ci.json
            src/artifacts/pip-freeze.txt
            src/artifacts/runtime.txt
          if-no-files-found: error

  platform-smoke:
    name: platform-smoke (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install core smoke dependencies
        run: |
          python -m pip install --upgrade "pip==25.0.1"
          python -m pip install --constraint constraints-ci.txt -e ".[audio,dev]"
      - name: Verify dependency graph
        run: python -m pip check
      - name: Compile and run smoke checks
        run: |
          python -m compileall -q .
          python tests/run_smoke.py

  ml-import-contracts:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install CPU ML import contracts
        run: |
          python -m pip install --upgrade "pip==25.0.1"
          python -m pip install -e ".[qa,alignment]"
      - name: Verify dependency graph
        run: python -m pip check
      - name: Import ML backends without model weights
        run: |
          python -c "import faster_whisper, whisperx, speechbrain; print('ML_IMPORT_CONTRACTS=VERIFIED')"
      - name: Capture resolved ML environment
        run: python -m pip freeze --all > artifacts/ml-pip-freeze.txt
      - name: Upload ML import evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ml-import-contracts-${{ github.run_id }}
          path: src/artifacts/ml-pip-freeze.txt
          if-no-files-found: error
