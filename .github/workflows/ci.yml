name: generic-dubbing-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dubbing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[audio,dev]"
      - name: Verify dependency graph
        run: python -m pip check
      - name: Full pytest discovery
        run: python -m pytest -q
      - name: Release gates
        run: python scripts/release_check.py --out artifacts/release_check_ci.json
      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-${{ github.run_id }}
          path: src/artifacts/release_check_ci.json
          if-no-files-found: ignore
